services:
  # Survey Statistics 应用
  survey-statistics:
    build:
      context: ../../..
      dockerfile: apps/survey-statistics/docker/Dockerfile
    container_name: survey-statistics-app
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
    volumes:
      - ./logs:/app/dist/apps/survey-statistics/src/logs
    networks:
      - survey-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: survey-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=survey_statistics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - survey-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survey_statistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: survey-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - survey-network
    command: redis-server --appendonly yes

networks:
  survey-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
